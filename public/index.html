<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baromètre du bonheur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: une scène pixel art 16:9 en haut, le relevé du baromètre dessous, puis deux cartes de choix côte à côte (empilées sur téléphone). */
:root {
  --plum: #2b1a2e;
  --ink: #1d1120;
  --wine: #6b2a4f;
  --magenta: #a8336f;
  --violet: #a77bcf;
  --lav: #e8cdea;
  --card: #3a2342;
  --bilge: #f0a93c;
  --lele: #7f9cf0;
  --sun: #ffd34e;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plum);
  color: var(--lav);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 0 36px;
}
.wrap {
  max-width: 792px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;
  padding-top: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); font-weight: 600; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; text-wrap: balance; color: #fff4fb; }
.dayrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 4px; }
.daytext { color: var(--violet); text-transform: capitalize; font-weight: 600; min-width: 11ch; }
button.dbtn, button.today, input.dayinput {
  background: var(--card); border: 2px solid var(--wine); color: var(--lav); font: 600 14px var(--font-body);
  padding: 4px 10px; cursor: pointer; min-height: 32px;
}
button.dbtn { width: 32px; padding: 4px 0; font-size: 18px; line-height: 1; }
button.dbtn:disabled { opacity: .35; cursor: default; }
button.dbtn:not(:disabled):hover, button.today:hover, input.dayinput:hover { border-color: var(--magenta); }
input.dayinput { color-scheme: dark; }

.frame { border-bottom: 4px solid var(--lav); box-shadow: 0 6px 0 var(--wine); background: var(--ink); line-height: 0; }
#stage { width: 100%; height: min(56.25vw, 62vh); min-height: 200px; display: block; object-fit: cover; object-position: 50% 85%; image-rendering: pixelated; }

.readout { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; }
.readout .text { flex: 1 1 280px; min-width: 0; }
.readout h2 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 5vw, 28px); line-height: 1.15; text-wrap: balance; color: #fff4fb; }
.readout p { margin: 0; color: var(--lav); max-width: 52ch; }
.gauge { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.gauge .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); font-weight: 600; display: flex; gap: 10px; }
.gauge .label b { font-family: var(--font-display); font-size: 16px; letter-spacing: 0; color: var(--lav); font-weight: 700; }
.pips { display: flex; gap: 4px; }
.pip { width: 22px; height: 22px; background: var(--card); border: 2px solid var(--wine); }

.pickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
.who { background: var(--card); border: 3px solid var(--wine); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.who h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 20px; color: #fff4fb; }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
button.mood {
  background: var(--plum); border: 3px solid var(--wine); color: var(--lav);
  padding: 8px 2px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font: 600 11px/1.2 var(--font-body); transition: transform .1s;
}
button.mood canvas { width: 100%; max-width: 60px; height: auto; aspect-ratio: 16 / 18; image-rendering: pixelated; display: block; }
button.mood:hover { transform: translateY(-2px); border-color: var(--magenta); }
button.mood[aria-pressed="true"] { border-color: var(--lav); background: var(--wine); color: #fff4fb; }
.validate { background: var(--magenta); border: 3px solid var(--lav); color: #fff4fb; font: 700 14px var(--font-body); padding: 8px 12px; min-height: 40px; cursor: pointer; }
.validate:disabled { background: var(--plum); border-color: var(--wine); color: var(--violet); cursor: default; opacity: .75; }
.validate:not(:disabled):hover { background: #c23d84; }
.who.locked button.mood:not([aria-pressed="true"]) { opacity: .35; }
.who.locked button.mood { cursor: default; }
.who.locked button.mood:hover { transform: none; border-color: var(--wine); }
.who.locked button.mood[aria-pressed="true"]:hover { border-color: var(--lav); }
.unlock { background: transparent; border: 2px dashed var(--violet); color: var(--lav); font: 600 13px var(--font-body); padding: 5px 10px; cursor: pointer; }
.unlock:hover { border-color: var(--lav); color: #fff4fb; }
.vmsg { min-height: 1.2em; font-size: 13px; color: var(--sun); }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.purse { display: flex; align-items: center; gap: 14px; background: var(--card); border: 3px solid var(--wine); padding: 12px 16px; }
.purse .coin { flex: none; width: 32px; height: 32px; background: #ffd34e; border: 3px solid #b7791f; box-shadow: inset -4px -4px 0 #e9a43b, inset 3px 3px 0 #fff0a0; border-radius: 50%; }
.purse .coin.pop { animation: coinpop .6s steps(6); }
@keyframes coinpop { 0% { transform: translateY(0) scaleX(1); } 40% { transform: translateY(-10px) scaleX(.2); } 80% { transform: translateY(-4px) scaleX(1); } 100% { transform: none; } }
.purse-text b { font-family: var(--font-display); font-size: 26px; color: #ffd34e; }
.purse-text small { display: block; color: var(--lav); }
.shop { background: var(--card); border: 3px solid var(--wine); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.shop h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 24px; color: #fff4fb; }
.shop-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.me { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--violet); }
.shop button { background: var(--plum); border: 2px solid var(--wine); color: var(--lav); font: 600 14px var(--font-body); padding: 5px 12px; min-height: 34px; cursor: pointer; }
.shop button:hover:not(:disabled) { border-color: var(--magenta); }
.shop button:disabled { opacity: .4; cursor: default; }
.shop button[aria-pressed="true"], .shop button.on { background: var(--wine); border-color: var(--magenta); color: #fff4fb; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-title { margin: 6px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--violet); font-weight: 600; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { background: var(--plum); border: 2px solid var(--wine); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item canvas { width: 100%; max-width: 96px; height: auto; aspect-ratio: 1; image-rendering: pixelated; align-self: center; background: #4a2d52; }
.item b { color: #fff4fb; font-weight: 600; }
.item .price { color: var(--sun); font-size: 14px; }
.item .row { display: flex; flex-wrap: wrap; gap: 6px; }
.item .row button { flex: 1 1 auto; padding: 4px 8px; font-size: 13px; }
.sendrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sendrow input { background: var(--plum); border: 2px solid var(--wine); color: var(--lav); font: 600 14px var(--font-body); padding: 5px 8px; min-height: 34px; }
.sendrow input[type=number] { width: 90px; }
.sendrow input[type=text] { flex: 1 1 160px; min-width: 0; }
.shopmsg { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--sun); }
.inbox { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.inbox li { padding-left: 10px; border-left: 3px solid var(--magenta); }
.stats { background: var(--card); border: 3px solid var(--wine); padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.badges { background: var(--card); border: 3px solid var(--wine); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.badges h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 24px; color: #fff4fb; }
.badges h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 18px; color: #fff4fb; display: flex; align-items: baseline; gap: 10px; }
.badges h3 small { font: 600 12px var(--font-body); color: var(--violet); letter-spacing: .08em; text-transform: uppercase; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.badge { background: var(--plum); border: 2px solid var(--wine); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
.badge canvas { width: 56px; height: 56px; image-rendering: pixelated; }
.badge b { color: #fff4fb; font-size: 14px; line-height: 1.2; }
.badge span { font-size: 12px; color: var(--violet); line-height: 1.3; }
.badge.on { border-color: var(--sun); }
.badge.off canvas { filter: grayscale(1) brightness(.45); }
.badge.off b { color: var(--violet); }
.changelog { display: flex; flex-direction: column; gap: 12px; }
.changelog details { border-left: 3px solid var(--magenta); padding-left: 12px; }
.changelog summary { cursor: pointer; font-weight: 600; color: #fff4fb; }
.changelog ul { margin: 8px 0 4px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.stats-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.stats h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 24px; color: #fff4fb; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthlabel { min-width: 12ch; text-align: center; text-transform: capitalize; font-weight: 600; color: var(--lav); }
.note { margin: 0; font-size: 13px; color: var(--violet); }
.note.sample { color: var(--sun); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--plum); border: 2px solid var(--wine); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--violet); }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: #fff4fb; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--lav); }
.sw { display: inline-block; width: 10px; height: 10px; flex: none; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); font-size: 14px; fill: var(--violet); }
.chart .grid { stroke: var(--wine); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--lav); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.facts li { padding-left: 14px; position: relative; max-width: 62ch; }
.facts li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; background: var(--magenta); }
.facts b { color: #fff4fb; }
.sec { border-color: var(--acc) !important; box-shadow: inset 0 6px 0 var(--acc); background: color-mix(in srgb, var(--acc) 9%, var(--card)) !important; padding-top: 22px !important; }
.sec > h2, .sec .shop-top h2, .sec .stats-head h2 { color: var(--acc) !important; }
.sec-hum { --acc: #f06ea0; } .sec-shop { --acc: #ffb347; } .sec-stats { --acc: #5cb8ee; } .sec-badges { --acc: #86d86f; }
.who.sec { padding-top: 22px; }
.who.sec h3 { color: var(--acc); }
.shop .purse { border: 2px solid color-mix(in srgb, var(--acc) 55%, var(--wine)); background: var(--plum); }
.shop button[aria-pressed="true"], .shop button.on { background: color-mix(in srgb, var(--acc) 35%, var(--plum)); border-color: var(--acc); }
.shop button:hover:not(:disabled) { border-color: var(--acc); }
.badge.on { border-color: var(--acc); }
.foot { display: flex; justify-content: center; padding: 4px 0 8px; }
button.linkbtn { background: transparent; border: 0; color: var(--violet); font: 600 14px var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 12px; }
button.linkbtn:hover { color: #fff4fb; }
dialog#logDlg { background: var(--card); color: var(--lav); border: 3px solid var(--magenta); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: 82vh; }
dialog#logDlg::backdrop { background: rgba(10, 4, 16, .72); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 2px solid var(--wine); position: sticky; top: 0; background: var(--card); }
.dlg-head h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 22px; color: #fff4fb; }
.dlg-body { padding: 14px 16px 18px; overflow: auto; max-height: calc(82vh - 64px); }
.dlg-x { background: var(--plum); border: 2px solid var(--wine); color: var(--lav); font: 600 14px var(--font-body); min-height: 34px; padding: 4px 12px; cursor: pointer; }
.dlg-x:hover { border-color: var(--magenta); }
.validate.done { background: var(--plum); border-color: var(--sun); color: var(--sun); opacity: 1; }
.validate.done:not(:disabled):hover { background: var(--wine); }
@media (prefers-reduced-motion: reduce) { button.mood { transition: none; } }
</style>
</head>
<body>

<section class="frame" aria-label="Scène du jour">
  <canvas id="stage" role="img" aria-label="Scène en pixel art de Bilge et Lélé"></canvas>
</section>

<main class="wrap">
  <header>
    <span class="eyebrow">Bilge &amp; Lélé</span>
    <h1>Baromètre du bonheur</h1>
    <div class="dayrow">
      <button class="dbtn" id="dprev" type="button" aria-label="Jour précédent">&#8249;</button>
      <span class="daytext" id="daytext"></span>
      <button class="dbtn" id="dnext" type="button" aria-label="Jour suivant">&#8250;</button>
      <input class="dayinput" id="dayinput" type="date" aria-label="Choisir un jour">
      <button class="today" id="dtoday" type="button" hidden>Aujourd&rsquo;hui</button>
    </div>
  </header>

  <section class="readout" aria-live="polite">
    <div class="text">
      <h2 id="title"></h2>
      <p id="caption"></p>
    </div>
    <div class="gauge">
      <div class="label">Baromètre <b id="gaugeval">–</b></div>
      <div class="pips" id="pips"></div>
    </div>
  </section>

  <section class="pickers" id="pickers"></section>

  <section class="shop sec sec-shop" id="shop" aria-label="Boutique">
    <div class="shop-top">
      <h2>Boutique</h2>
      <div class="me">Je suis
        <button type="button" data-me="bilge" aria-pressed="false">Bibi</button>
        <button type="button" data-me="lele" aria-pressed="false">Lélé</button>
      </div>
    </div>
    <div class="purse" aria-label="Cagnotte">
      <div class="coin" aria-hidden="true"></div>
      <div class="purse-text"><b id="coinTotal">0</b> <span id="coinLbl">pièce dans la cagnotte</span>
        <small id="coinWho"></small></div>
    </div>
    <div class="tabs" id="shopTabs">
      <button type="button" data-tab="shop" aria-pressed="true">Boutique</button>
      <button type="button" data-tab="closet" aria-pressed="false">Mon placard</button>
      <button type="button" data-tab="send" aria-pressed="false">Envoyer / recevoir</button>
    </div>
    <div id="shopBody"></div>
    <p class="shopmsg" id="shopMsg" aria-live="polite"></p>
    <ul class="inbox" id="inbox"></ul>
  </section>

  <section class="stats sec sec-stats" aria-label="Statistiques">
    <div class="stats-head">
      <h2>Statistiques du mois</h2>
      <div class="monthnav">
        <button class="dbtn" id="mprev" type="button" aria-label="Mois précédent">&#8249;</button>
        <span class="monthlabel" id="monthlabel"></span>
        <button class="dbtn" id="mnext" type="button" aria-label="Mois suivant">&#8250;</button>
      </div>
    </div>
    <p class="note" id="statnote"></p>
    <div class="tiles" id="tiles"></div>
    <svg class="chart" id="chart" viewBox="0 0 520 170" role="img" aria-label="Humeur de Bilge et de Lélé jour par jour"></svg>
    <div class="legend" id="legend"></div>
    <ul class="facts" id="facts"></ul>
  </section>
  <section class="badges sec sec-badges" id="badges" aria-label="Badges du mois"></section>

  <div class="foot"><button type="button" class="linkbtn" id="logOpen">Journal des mises à jour</button></div>
  <dialog id="logDlg" aria-labelledby="logTitle">
    <div class="dlg-head"><h2 id="logTitle">Journal des mises à jour</h2><button type="button" class="dlg-x" id="logClose">Fermer</button></div>
    <div class="dlg-body"><div class="changelog" id="changelog"></div></div>
  </dialog>
</main>

<script>
(function () {
  'use strict';
  var W = 288, H = 162, DX = 48, DY = 54, HY = 64; /* la scène d'origine (192x108) est centrée dans un monde plus grand */
  var stage = document.getElementById('stage');
  var SS = 4, ZZ = 1.25, KK = SS * ZZ;   // résolution interne x4, zoom du monde x1,25 : un pixel du décor = 5 pixels nets
  stage.width = W * SS; stage.height = H * SS;
  var g = stage.getContext('2d');

  /* ---------- helpers ---------- */
  function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
  function disc(c, cx, cy, rad, col) {
    c.fillStyle = col;
    for (var y = -rad; y <= rad; y++) {
      var w = Math.floor(Math.sqrt(rad * rad - y * y + rad * 0.4));
      c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    }
  }
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function drift(t, x0, sp) { var L = W + 80; return (((x0 + t * sp) % L) + L) % L - 50 - DX; }

  /* ---------- personnages ---------- */
  function head(c, who, mood, ox, oy, bust) {
    function P(x, y, w, h, col) { R(c, ox + x, oy + y, w, h, col); }
    var B = who === 'bilge';
    var skin = B ? '#dc9d74' : '#d9a47e', sh = B ? '#c4825a' : '#c28a64';
    var hair = B ? '#3a2219' : '#2c1d17', hi = B ? '#5b3828' : '#46302a';
    var E = '#1d1120', WH = '#fff6ee', LIP = B ? '#b03a5c' : '#9a4650';
    var TEAR = '#7cc4ff', BL = '#ea8f84', GOLD = '#f2c14e', beard = '#33241c';

    if (B) { P(2, 3, 12, 13, hair); P(3, 2, 10, 1, hair); P(4, 1, 8, 1, hair); }
    else { P(3, 2, 10, 3, hair); P(4, 1, 8, 1, hair); }
    P(6, 12, 4, B ? 4 : 2, skin);
    P(4, 4, 8, 8, skin); P(5, 12, 6, 1, skin);
    if (B) { P(4, 4, 3, 2, hair); P(9, 4, 3, 2, hair); P(5, 2, 3, 1, hi); }
    else { P(3, 4, 1, 3, hair); P(12, 4, 1, 3, hair); P(4, 4, 8, 1, hair); P(5, 2, 4, 1, hi); P(3, 7, 1, 2, skin); P(12, 7, 1, 2, skin); }
    P(7, 8, 2, 1, sh);
    if (B) P(6, 9, 1, 1, GOLD);
    if (!B) { P(4, 10, 8, 3, beard); P(5, 13, 6, 1, beard); P(4, 9, 8, 1, beard); }

    if (mood === 'happy') {
      P(5, 6, 2, 1, E); P(4, 7, 1, 1, E); P(7, 7, 1, 1, E);
      P(9, 6, 2, 1, E); P(8, 7, 1, 1, E); P(11, 7, 1, 1, E);
      if (B) { P(4, 9, 2, 1, BL); P(10, 9, 2, 1, BL); P(5, 10, 1, 1, LIP); P(10, 10, 1, 1, LIP); P(6, 10, 4, 1, WH); P(6, 11, 4, 1, LIP); }
      else { P(6, 10, 4, 1, WH); P(7, 11, 2, 1, LIP); }
    } else if (mood === 'neutral') {
      P(5, 6, 2, 2, E); P(5, 6, 1, 1, WH); P(9, 6, 2, 2, E); P(9, 6, 1, 1, WH);
      if (B) P(6, 11, 4, 1, LIP); else P(6, 10, 4, 1, '#b98070');
    } else if (mood === 'low') {
      P(5, 7, 2, 2, E); P(9, 7, 2, 2, E); P(5, 6, 2, 1, hair); P(9, 6, 2, 1, hair);
      if (B) { P(6, 11, 4, 1, LIP); P(5, 12, 1, 1, LIP); P(10, 12, 1, 1, LIP); }

    for (i = 0; i < n; i++) { sb += rows[i].b; sl += rows[i].l; }
    var ab = n ? sb / n : 0, al = n ? sl / n : 0;
    function tile(color, label, val, sub) { return '<div class="tile"><span class="k">' + (color ? '<span class="sw" style="background:' + color + '"></span>' : '') + label + '</span><span class="v">' + val + '</span><span class="s">' + sub + '</span></div>'; }
    el('tiles').innerHTML =
      tile('var(--bilge)', 'Bilge', n ? ab.toFixed(1) + '/5' : '–', n ? MOODWORD[Math.round(ab) - 1] + ' en moyenne' : 'Pas encore de réponse') +
      tile('var(--lele)', 'Lélé', n ? al.toFixed(1) + '/5' : '–', n ? MOODWORD[Math.round(al) - 1] + ' en moyenne' : 'Pas encore de réponse') +
      tile('', 'Jours à deux', String(n), n === 1 ? 'réponse complète' : 'réponses complètes');

    // graphique
    var L = 58, T = 12, PW = 452, PH = 130, svg = '', v, X = function (day) { return dim > 1 ? L + (day - 1) / (dim - 1) * PW : L + PW / 2; }, Y = function (val) { return T + (5 - val) / 4 * PH; };
    for (v = 1; v <= 5; v++) svg += '<line class="grid" x1="' + L + '" x2="' + (L + PW) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + MOODWORD[v - 1] + '</text>';
    var ticks = [1, 5, 10, 15, 20, 25, dim];
    for (i = 0; i < ticks.length; i++) { if (ticks[i] > dim || (i === ticks.length - 1 && dim - ticks[i - 1] < 3)) continue; svg += '<text x="' + X(ticks[i]) + '" y="' + (T + PH + 20) + '" text-anchor="middle">' + ticks[i] + '</text>'; }
    [['b', 'var(--bilge)', -2], ['l', 'var(--lele)', 2]].forEach(function (sr) {
      var seg = [], j, r, pts = '';
      function flush() { if (seg.length > 1) svg += '<polyline fill="none" stroke="' + sr[1] + '" stroke-width="2" points="' + seg.join(' ') + '"/>'; seg = []; }
      for (j = 0; j < dim; j++) { r = list[j]; if (!r) { flush(); continue; } seg.push((X(r.d) + sr[2]) + ',' + Y(r[sr[0]])); }
      flush();
      for (j = 0; j < dim; j++) { r = list[j]; if (r) svg += '<rect x="' + (X(r.d) + sr[2] - 3) + '" y="' + (Y(r[sr[0]]) - 3) + '" width="6" height="6" fill="' + sr[1] + '"/>'; }
    });
    el('chart').innerHTML = svg;
    var lg = '<span><i class="sw" style="background:var(--bilge)"></i>Bilge</span><span><i class="sw" style="background:var(--lele)"></i>Lélé</span>';
    el('legend').innerHTML = lg;

    // phrases
    var f = [];
    if (!n) f.push("Pas encore de réponse à deux ce mois-ci. Choisissez chacun une humeur pour voir la courbe apparaître.");
    else {
      var diff = ab - al;
      f.push(Math.abs(diff) < 0.05 ? "Égalité parfaite ce mois-ci : <b>aucune des deux n'a le dessus</b>." : "<b>" + (diff > 0 ? 'Bilge' : 'Lélé') + "</b> a eu la meilleure humeur du mois, avec " + Math.abs(diff).toFixed(1) + " point d'avance.");
      var same = 0, comfort = 0, best = rows[0], streak = 0, run = 0, prev = -9;
      for (i = 0; i < n; i++) {
        if (rows[i].b === rows[i].l) same++;
        if (rows[i].kind === 'comfort') comfort++;
        if (rows[i].b + rows[i].l > best.b + best.l) best = rows[i];
        if (rows[i].b + rows[i].l >= 7) { run = (rows[i].d === prev + 1) ? run + 1 : 1; prev = rows[i].d; if (run > streak) streak = run; } else { run = 0; prev = -9; }
      }
      f.push("Vous avez eu <b>la même humeur " + same + " jour" + (same > 1 ? 's' : '') + "</b> sur " + n + ".");
      if (comfort) f.push("<b>" + comfort + " jour" + (comfort > 1 ? 's' : '') + " de câlin</b> : l'une avait besoin de l'autre.");
      f.push("Meilleur jour : le <b>" + best.d + " " + fmt(new Date(y, m, 1), { month: 'long' }) + "</b> (" + KINDINFO[best.kind][0].toLowerCase() + ").");
      if (streak >= 2) f.push("Série de beau temps à deux : <b>" + streak + " jours de suite</b>.");
    }
    el('facts').innerHTML = f.map(function (t) { return '<li>' + t + '</li>'; }).join('');
  }

  setDay(todayKey); renderCoins(); renderShop(); fetchShop();
  if (!reduce) {
    (function frame() {
      var f = Math.floor(now() * 10);
      if (f !== last) { last = f; draw(now()); }
      requestAnimationFrame(frame);
    })();
  }
})();
  (function () {
    var dlg = document.getElementById('logDlg'), o = document.getElementById('logOpen'), c = document.getElementById('logClose');
    o.addEventListener('click', function () { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); });
    c.addEventListener('click', function () { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg && dlg.close) dlg.close(); });
  })();
</script>
</body>
</html>
